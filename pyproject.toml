[project]
name = "llm2sh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "openai>=2.40.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "textual>=8.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-textual-snapshot>=0.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
llm2sh = "llm2sh.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm2sh"]